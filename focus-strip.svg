<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="title desc">
<title id="title">Current focus: ServiceHub, Python, and AI fundamentals</title>
<desc id="desc">An animated activity strip with three focus areas and softly pulsing indicators.</desc>
