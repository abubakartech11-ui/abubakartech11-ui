<style>text{font-family:Arial,Helvetica,sans-serif}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect x="1" y="1" width="1198" height="108" rx="14" fill="url(#bg)" stroke="#29384e"/>
